<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pip — Hassen’s voice companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --text:#F2F4FF; --dim:rgba(242,244,255,.58); --faint:rgba(242,244,255,.3);
  --line:rgba(242,244,255,.2); --accent:#EAF0FF;
  --you:#FF5FA2; --topics:#3FE3FF; --seen:#FFB547; --plans:#9D7BFF;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; --text:#F2F4FF; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#000; --text:#F2F4FF; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Sora','Avenir Next','Segoe UI',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#neon{opacity:.95}
.brand{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:20px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.brand b{font-weight:300;font-size:15px;letter-spacing:.04em}
.brand span{font-size:11px;font-weight:300;color:var(--faint);letter-spacing:.04em;transition:color .4s}
.brand span.ok{color:rgba(120,255,200,.6)}
.status{
  position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;align-items:center;gap:9px;
  font-weight:300;font-size:12px;letter-spacing:.1em;color:var(--dim);
  opacity:0;transition:opacity .8s;pointer-events:none;
}
.status.on{opacity:1}
.zoom{position:fixed;left:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:12px;font-weight:300;letter-spacing:.08em;color:var(--dim);opacity:0;transition:opacity .5s;pointer-events:none}
.zoom.on{opacity:1}
.status i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}

/* lobe labels */
.lobe{position:fixed;left:0;top:0;transform:translate(-50%,0);pointer-events:none;text-align:center;white-space:nowrap;
  font-size:12px;font-weight:300;letter-spacing:.06em;color:var(--c);opacity:0;transition:opacity 1s}
.lobe.on{opacity:.9}
.lobe small{display:block;font-size:10px;color:var(--faint);letter-spacing:.08em;margin-top:2px}
.lobe.bump b{animation:bump .6s ease}
.lobe b{font-weight:400;display:inline-block;text-shadow:0 0 14px var(--c)}
@keyframes bump{40%{transform:scale(1.35)}}

/* memory pops */
.mem-pop{position:fixed;left:0;top:0;pointer-events:none;max-width:240px;
  padding:9px 13px;border-radius:14px;font-size:12.5px;font-weight:300;line-height:1.45;color:var(--text);
  background:rgba(8,8,16,.72);border:1px solid color-mix(in srgb, var(--c) 55%, transparent);
  box-shadow:0 0 24px color-mix(in srgb, var(--c) 30%, transparent), inset 0 0 18px color-mix(in srgb, var(--c) 10%, transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  animation:memIn .55s cubic-bezier(.2,1.4,.4,1) both}
.mem-pop em{display:block;font-style:normal;font-size:10px;letter-spacing:.12em;color:var(--c);margin-bottom:3px}
.mem-pop.gone{background:transparent;border-color:transparent;box-shadow:none;transition:background .5s,border-color .5s,box-shadow .5s}
@keyframes memIn{from{opacity:0;transform:translate(var(--x),var(--y)) scale(.7)}}

/* captions that materialise and dissolve */
.caption{position:fixed;left:50%;bottom:calc(58px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  width:min(760px,92vw);display:grid;place-items:end center;pointer-events:none;min-height:5.2em}
.caption::before{content:"";position:absolute;inset:-28px -40px;border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(0,0,0,.7), transparent 70%);opacity:0;transition:opacity .6s}
.caption.show::before{opacity:1}
.caption::after{content:"";position:absolute;bottom:-14px;left:50%;height:1px;width:0;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,var(--topics),var(--you),transparent);transition:width .9s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 0 12px var(--you)}
.caption.show::after{width:62%}
.cap-line,.heard-line{grid-area:1/1;margin:0;text-align:center;position:relative}
.cap-line{font-size:clamp(18px,2.1vw,24px);font-weight:300;line-height:1.5;color:var(--text);text-shadow:0 0 22px rgba(255,255,255,.22)}
.heard-line{font-size:clamp(14px,1.6vw,17px);font-weight:300;color:var(--dim);font-style:italic}
.w{display:inline-block;animation:wIn .55s cubic-bezier(.2,.8,.2,1) both}
.c{display:inline-block;transition:transform 1.3s cubic-bezier(.15,.6,.2,1),opacity 1.2s ease,filter 1.2s ease;white-space:pre}
.gone .c{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0;filter:blur(5px)}
@keyframes wIn{from{opacity:0;filter:blur(10px);transform:translateY(10px) scale(.96)}}

/* notices */
.note{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:min(520px,80vw);
  padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:300;color:var(--text);text-align:center;
  background:rgba(10,10,20,.7);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  animation:memIn .5s cubic-bezier(.2,1.4,.4,1) both;--x:0;--y:-8px;pointer-events:none}

/* gate */
.gate{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding:0 24px calc(48px + env(safe-area-inset-bottom,0px));gap:14px;text-align:center;
  background:linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,.4) 50%, rgba(0,0,0,0) 75%);transition:opacity .7s ease}
.gate.gone{opacity:0;pointer-events:none}
.gate h1{margin:0;font-weight:200;font-size:clamp(30px,4vw,46px);letter-spacing:-.01em}
.gate p{margin:0;font-weight:300;font-size:14px;color:var(--dim);max-width:38ch;line-height:1.6}
.gate form{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(360px,88vw)}
.gate label{width:100%;display:flex;flex-direction:column;gap:5px;text-align:left;font-size:11px;letter-spacing:.06em;color:var(--faint)}
.gate label[hidden]{display:none}
.gate input{width:100%;box-sizing:border-box;font:inherit;font-size:14px;font-weight:300;color:var(--text);letter-spacing:0;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.gate input::placeholder{color:var(--faint)}
.gate input:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.gate .go{margin-top:6px;font:inherit;font-size:15px;color:var(--text);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:13px 30px;cursor:pointer;transition:border-color .3s,background .3s}
.gate .go:hover{border-color:var(--text);background:rgba(255,255,255,.05)}
.gate .go:focus-visible,.gate .link:focus-visible{outline:2px solid var(--text);outline-offset:4px}
.gate .go[disabled]{opacity:.5;cursor:progress}
.gate .link{border:0;background:none;color:var(--faint);font:inherit;font-size:12px;cursor:pointer;padding:4px 8px}
.gate .link:hover{color:var(--text)}
.gate .link[hidden]{display:none}
.gate .msg{min-height:1.4em;font-size:12.5px;color:#FFB0C8}
.nudge{animation:nudge .4s}
@keyframes nudge{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* eye (screen sharing) */
.eye{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.02);
  color:var(--dim);display:grid;place-items:center;cursor:pointer;transition:color .3s,border-color .3s,box-shadow .3s}
.eye[hidden]{display:none}
.eye:hover{color:var(--text);border-color:var(--text)}
.eye:focus-visible{outline:2px solid var(--text);outline-offset:4px}
.eye.on{color:#FFD58A;border-color:var(--seen);box-shadow:0 0 0 6px rgba(255,181,71,.08),0 0 24px rgba(255,181,71,.35)}

/* camera */
.cam{position:fixed;right:calc(78px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.02);
  color:var(--dim);display:grid;place-items:center;cursor:pointer;transition:color .3s,border-color .3s,box-shadow .3s}
.cam[hidden]{display:none}
.cam:hover{color:var(--text);border-color:var(--text)}
.cam:focus-visible{outline:2px solid var(--text);outline-offset:4px}
.cam.on{color:#9FF7FF;border-color:var(--topics);box-shadow:0 0 0 6px rgba(63,227,255,.08),0 0 24px rgba(63,227,255,.35)}
.lens{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));
  width:132px;height:132px;border-radius:50%;overflow:hidden;opacity:0;transform:scale(.6);pointer-events:none;
  transition:opacity .5s,transform .6s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 0 1.5px var(--topics),0 0 34px rgba(63,227,255,.45);cursor:pointer;background:#000}
.lens.on{opacity:1;transform:scale(1);pointer-events:auto}
.lens video{width:100%;height:100%;object-fit:cover;display:block}
.lens.mirror video{transform:scaleX(-1)}
.lens i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 58%,rgba(0,0,0,.5));pointer-events:none}
.lens.looking{box-shadow:0 0 0 2px var(--seen),0 0 44px rgba(255,181,71,.6)}
.lens.looking i{background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,181,71,.55) 85%,transparent 100%);animation:sweep 1.1s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@media (max-width:820px){ .lens{width:104px;height:104px} }

/* web results */
.web{position:fixed;top:50%;left:clamp(14px,4vw,64px);width:min(320px,86vw);box-sizing:border-box;padding:16px 16px 14px;border-radius:20px;
  background:rgba(8,14,14,.62);border:1px solid rgba(108,255,196,.25);box-shadow:0 0 40px rgba(108,255,196,.12);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  opacity:0;transform:translateY(-50%) translateX(-24px) scale(.97);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.2,1);pointer-events:none}
.web.show{opacity:1;transform:translateY(-50%) translateX(0) scale(1);pointer-events:auto}
.web-title{margin:0;display:flex;align-items:center;gap:9px;font-size:12px;font-weight:300;letter-spacing:.08em;color:#BFFFE6}
.web-title b{width:8px;height:8px;border-radius:50%;background:#6CFFC4;box-shadow:0 0 12px #6CFFC4}
.web.searching .web-title b{animation:blinkDot .8s ease-in-out infinite}
@keyframes blinkDot{50%{opacity:.25;transform:scale(.7)}}
.web-q{margin:8px 0 12px;font-size:14px;font-weight:300;color:var(--text);line-height:1.45}
.web ol{list-style:none;margin:0;padding:0 0 0 18px;position:relative;display:flex;flex-direction:column;gap:9px}
.web ol::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:linear-gradient(#6CFFC4,rgba(108,255,196,.05));box-shadow:0 0 8px #6CFFC4}
.web li{position:relative;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.web li::before{content:"";position:absolute;left:-17px;top:7px;width:7px;height:7px;border-radius:50%;background:#6CFFC4;box-shadow:0 0 10px #6CFFC4}
.web li a{display:block;color:var(--text);text-decoration:none;font-size:13px;font-weight:300;line-height:1.4}
.web li a:hover span{text-decoration:underline}
.web li a:focus-visible{outline:2px solid #6CFFC4;outline-offset:3px;border-radius:4px}
.web li small{display:block;font-size:11px;color:rgba(191,255,230,.55);margin-top:1px}
.web li.ghost{height:30px;border-radius:8px;background:linear-gradient(90deg,rgba(108,255,196,.05),rgba(108,255,196,.16),rgba(108,255,196,.05));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.web li.ghost::before{opacity:.4}
@keyframes shimmer{to{background-position:-200% 0}}

/* memory view */
.memview{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.memview.on{opacity:1}
.memview svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 4px rgba(255,255,255,.35))}
.mcard{position:absolute;left:0;top:0;max-width:220px;padding:8px 12px;border-radius:14px;font-size:12.5px;font-weight:300;line-height:1.4;color:var(--text);
  background:rgba(8,8,16,.74);border:1px solid color-mix(in srgb, var(--c) 55%, transparent);
  box-shadow:0 0 20px color-mix(in srgb, var(--c) 28%, transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  pointer-events:auto;cursor:pointer;animation:mIn .55s cubic-bezier(.2,1.4,.4,1) both}
.mcard small{display:block;font-size:10px;letter-spacing:.06em;color:var(--c);margin-top:2px;opacity:.8}
.mcard:hover{border-color:var(--c)}
.mcard.gone{background:transparent;border-color:transparent;box-shadow:none;transition:background .5s,border-color .5s,box-shadow .5s}
@keyframes mIn{from{opacity:0;scale:.6}}
.mem-head{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;
  padding:8px 8px 8px 16px;border-radius:999px;background:rgba(10,10,20,.72);border:1px solid var(--line);pointer-events:auto;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mem-head b{font-weight:300;font-size:13px;letter-spacing:.04em}
.mem-head button{font:inherit;font-size:12px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.mem-head button:hover{border-color:var(--text)}
.mem-head button:focus-visible{outline:2px solid var(--text);outline-offset:3px}
@media (max-width:820px){
  .web{top:calc(60px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(-12px) scale(.97)}
  .web.show{transform:translateX(-50%) translateY(0) scale(1)}
  .mcard{max-width:150px;font-size:11.5px}
}

/* vision card */
.seen{position:fixed;top:50%;right:clamp(14px,4vw,64px);width:min(300px,86vw);box-sizing:border-box;padding:13px;border-radius:20px;
  background:rgba(10,10,18,.6);border:1px solid rgba(255,181,71,.25);box-shadow:0 0 40px rgba(255,181,71,.12);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  opacity:0;transform:translateY(-50%) translateX(24px) scale(.97);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.2,1);pointer-events:none}
.seen.show{opacity:1;transform:translateY(-50%) translateX(0) scale(1)}
.shot{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:#0a0a0a}
.shot img{width:100%;height:100%;object-fit:cover;display:block;opacity:.9}
.shot .scan{position:absolute;left:0;right:0;top:-40%;height:40%;opacity:0;background:linear-gradient(to bottom,transparent,rgba(255,181,71,.35) 70%,rgba(255,213,138,.9) 98%,transparent);mix-blend-mode:screen}
.seen.scanning .scan{opacity:1;animation:scan 1.4s linear infinite}
.shot i{position:absolute;width:14px;height:14px;border:1.5px solid var(--seen)}
.shot .tl{top:8px;left:8px;border-right:0;border-bottom:0}.shot .tr{top:8px;right:8px;border-left:0;border-bottom:0}
.shot .bl{bottom:8px;left:8px;border-right:0;border-top:0}.shot .br{bottom:8px;right:8px;border-left:0;border-top:0}
.seen-title{margin:12px 2px 9px;font-weight:300;font-size:12px;letter-spacing:.08em;color:var(--dim)}
.seen ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:7px}
.seen li{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:999px;font-size:12.5px;font-weight:300;
  background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.3);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.seen li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--seen);box-shadow:0 0 8px var(--seen)}
@keyframes scan{to{top:100%}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.85)}}
@media (max-width:820px){
  .seen{top:calc(60px + env(safe-area-inset-top,0px));right:50%;transform:translateX(50%) translateY(-12px) scale(.97)}
  .seen.show{transform:translateX(50%) translateY(0) scale(1)}
  .lobe{font-size:11px}
}
@media (prefers-reduced-motion: reduce){
  .w,.mem-pop,.seen li{animation:none} .c{transition:opacity .4s} .gone .c{transform:none;filter:none}
  .seen.scanning .scan{animation:none;top:30%}
}
</style>
</head>
<body>
<canvas id="neon" aria-hidden="true"></canvas>
<canvas id="c" aria-hidden="true"></canvas>

<div class="brand" aria-hidden="true"><b>Pip</b><span id="sync">memory on this device</span></div>
<div id="labels" aria-hidden="true"></div>
<div id="pops" aria-hidden="true"></div>
<div class="caption" id="caption" aria-live="polite"></div>
<div class="zoom" id="zoom" aria-hidden="true">1.0×</div>
<div class="status" id="status"><i></i><span id="statusText">listening</span></div>

<div class="lens" id="lens" aria-hidden="true"><video id="camVideo" playsinline muted></video><i></i></div>
<button class="cam" id="cam" hidden aria-label="Let Pip see through your camera" title="Let Pip see through your camera">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></svg>
</button>
<button class="eye" id="eye" hidden aria-label="Let Pip see your screen" title="Let Pip see your screen">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
</button>

<aside class="web" id="web" aria-live="polite">
  <p class="web-title"><b></b><span id="webTitle">Searching the web…</span></p>
  <p class="web-q" id="webQ"></p>
  <ol id="webList"></ol>
</aside>
<div class="memview" id="memview">
  <svg id="memLines" aria-hidden="true"></svg>
  <div id="memCards"></div>
  <div class="mem-head"><b id="memTitle"></b><button id="memClose" type="button">Close</button></div>
</div>
<aside class="seen" id="seen" aria-live="polite">
  <div class="shot"><img id="shotImg" alt="The screen Pip is looking at"><span class="scan"></span><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
  <p class="seen-title" id="seenTitle">Pip sees</p>
  <ul id="seenList"></ul>
</aside>

<div class="gate" id="gate">
  <h1>Pip</h1>
  <p id="gateText">Your memory follows you to any computer or phone. Choose a passphrase only you know. You’ll type it once on each device.</p>
  <form id="gateForm" autocomplete="on">
    <input type="text" name="username" value="hassen" autocomplete="username" hidden>
    <label id="passRow">Memory passphrase
      <input id="pass" type="password" autocomplete="current-password" placeholder="At least 8 characters" spellcheck="false">
    </label>
    <label id="keyRow">Groq API key, only needed the first time
      <input id="key" type="password" autocomplete="off" placeholder="gsk_…" spellcheck="false">
    </label>
    <label id="elRow" hidden>ElevenLabs API key, optional, for a truly human British voice
      <input id="el" type="password" autocomplete="off" placeholder="sk_…" spellcheck="false">
    </label>
    <div class="msg" id="gateMsg" role="alert"></div>
    <button class="go" id="allow" type="submit">Allow microphone and voice</button>
  </form>
  <button class="link" id="addEleven" hidden>Add an ElevenLabs key for the most human voice</button>
  <button class="link" id="switchPass" hidden>Use a different passphrase</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const rnd = (a,b) => Math.random()*(b-a)+a;
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DPR = Math.min(devicePixelRatio || 1, 2);
let PR = DPR;

const enc = new TextEncoder(), dec = new TextDecoder();
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
function b64(bytes){ let s = ''; for (let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openVault(pass){
  const id = hex(await crypto.subtle.digest('SHA-256', enc.encode('pip-vault-id:v1:' + pass)));
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:enc.encode('pip-vault-salt:v1'), iterations:210000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
  return { id, key };
}
async function seal(obj, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj))));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
  return b64(all);
}
async function unseal(s, key){
  const all = unb64(s);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:all.slice(0,12) }, key, all.slice(12));
  return JSON.parse(dec.decode(pt));
}

let reasoningFlag = true;
async function groq(path, body, signal){
  const payload = Object.assign({}, body);
  if (path === '/chat/completions' && reasoningFlag && !/compound/.test(payload.model || '')) payload.reasoning_effort = 'none';
  const send = () => fetch(GROQ + path, { method:'POST', signal,
    headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + mem.groqKey }, body:JSON.stringify(payload) });
  let res = await send();
  if (res.status === 400){
    const t = await res.clone().text();
    if (payload.reasoning_effort && /reasoning/i.test(t)){ reasoningFlag = false; delete payload.reasoning_effort; res = await send(); }
    else if (payload.response_format && /response_format|json/i.test(t)){ delete payload.response_format; res = await send(); }
  }
  if (!res.ok){ const e = new Error('groq ' + res.status); e.status = res.status; try { e.detail = await res.text(); } catch(_){} throw e; }
  return res;
}
async function groqStream(messages, onText, signal){
  const res = await groq('/chat/completions', { model:CHAT_MODEL, messages, stream:true, temperature:.75, max_completion_tokens:380 }, signal);
  const reader = res.body.getReader(), td = new TextDecoder();
  let buf = '', text = '';
  for (;;){
    const { value, done } = await reader.read(); if (done) break;
    buf += td.decode(value, { stream:true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      const data = line.slice(5).trim();
      if (data === '[DONE]') return text;
      try { const d = JSON.parse(data).choices?.[0]?.delta?.content; if (d){ text += d; onText(text); } } catch(_){}
    }
  }
  return text;
}
function groqError(e){
  if (e && e.name === 'AbortError') return null;
  if (e && e.status === 401){ mem.groqKey = ''; saveMemory(true); return "Groq rejected my key, Hassen. Reload the page and paste a fresh one."; }
  if (e && e.status === 429) return "Groq says I’m talking too fast. Give me a moment, then ask again.";
  if (e && e.status >= 500) return "Groq is having a hiccup right now. Try me again in a moment.";
  if (e instanceof TypeError) return "I can’t reach Groq right now. Check the connection and try again.";
  return "My thoughts got tangled there. Could you say that again?";
}

function chunkForTTS(text, max = 190){
  const parts = [];
  splitSentences(text).forEach(s => {
    while (s.length > max){
      let cut = s.lastIndexOf(', ', max); if (cut < 60) cut = s.lastIndexOf(' ', max); if (cut < 40) cut = max;
      parts.push(s.slice(0, cut + 1).trim()); s = s.slice(cut + 1).trim();
    }
    if (s){
      const last = parts[parts.length - 1];
      if (last && last.length + s.length < max - 5) parts[parts.length - 1] = last + ' ' + s; else parts.push(s);
    }
  });
  return parts;
}

const capWrap = $('#caption');
function charify(el){
  const walker = [...el.childNodes];
  walker.forEach(n => {
    if (n.nodeType === 3){
      const frag = document.createDocumentFragment();
      for (const ch of n.textContent){ const s = document.createElement('span'); s.className = 'c'; s.textContent = ch; frag.appendChild(s); }
      n.replaceWith(frag);
    } else if (n.nodeType === 1 && !n.classList.contains('c')) charify(n);
  });
}
function disperse(el, lift = 40, removeAfter = 1800){
  el.querySelectorAll('.c').forEach(c => {
    const a = Math.random()*Math.PI*2, d = 30 + Math.random()*100;
    c.style.setProperty('--dx', (Math.cos(a)*d).toFixed(1) + 'px');
    c.style.setProperty('--dy', (Math.sin(a)*d*.7 - lift - Math.random()*30).toFixed(1) + 'px');
    c.style.setProperty('--r', ((Math.random()-.5)*180).toFixed(0) + 'deg');
    c.style.transitionDelay = (Math.random()*.35).toFixed(2) + 's';
  });

}
const captions = {
  current:null, heardEl:null, endT:0,
  show(text, dur){

      for (const ch of w){ const c = document.createElement('span'); c.className = 'c'; c.textContent = ch; ws.appendChild(c); }
      p.appendChild(ws);

Right now you are looking at a live photo from Hassen's camera. The person in view is most likely Hassen himself, so talk to him as "you".
Answer what he asked: describe his expression, what he's wearing or holding, the objects and the setting. Be warm and specific.
Never try to identify anyone from their face, and never guess anyone's identity, age or ethnicity.
Reply with ONLY a JSON object, nothing else: {"say": string, "seen": string[]}
- "say" is what you speak aloud: one to three natural spoken sentences. No markdown, no lists.
- "seen" is three to six very short labels (one to four words each) naming what you notice, like "smiling", "black hoodie", "coffee mug", "bookshelf".`;
const CAM_ON_RE = /\b(turn on|open|start|switch on|enable|use)\b.{0,20}\bcamera\b/i;
const CAM_OFF_RE = /\b(turn off|close|stop|switch off|disable)\b.{0,20}\bcamera\b/i;
const CAM_LOOK_RE = /\b(what do you see|what can you see|look at (me|this|that|it)|see (me|this|that)|can you see|my face|how do i look|what am i (holding|wearing|doing)|what('s| is) (this|that|in my hand)|in my hand|this (thing|object)|what colou?r|who is here|look around)\b/i;

async function routeVision(text){
  if (CAM_OFF_RE.test(text)){ stopCamera(); say("Okay, camera’s off."); return true; }
  if (camStream && FLIP_RE.test(text)){ await startCamera(/\bfront\b/i.test(text) ? 'user' : camFacing === 'user' ? 'environment' : 'user'); say("Switched cameras."); return true; }

  const wantsLook = CAM_LOOK_RE.test(text) || VISION_RE.test(text) || LOOK_RE.test(text);
  if (CAM_ON_RE.test(text) || (!wantsScreen && /\b(look at me|can you see me|see me|my face|how do i look)\b/i.test(text) && !camStream)){
    if (!camStream){
      setState('looking');
      const ok = await startCamera(/\b(back|rear)\b/i.test(text) ? 'environment' : 'user');
      if (!ok){ note(camError, 9000); say("I couldn’t open the camera, Hassen. Check the message at the top and try again."); return true; }
      if (!wantsLook){ say("Camera’s on. Ask me what I see."); return true; }
      await new Promise(r => setTimeout(r, 700));      // let the camera settle on a sharp frame
    }
    return look(text, 'camera'), true;
  }
  if (wantsScreen && (VISION_RE.test(text) || LOOK_RE.test(text))) return look(text, 'screen'), true;
  if (wantsLook && camStream) return look(text, 'camera'), true;
  if (wantsLook && screenStream) return look(text, 'screen'), true;
  if (VISION_RE.test(text)){ say("I can’t see anything yet. Say “turn on the camera”, or tap the eye to share your screen."); return true; }
  return false;
}

async function look(question, source = 'screen'){
  pushHistory('user', question);
  if (source === 'screen' && !screenStream){
    const ok = await startScreen();
    if (!ok){ pushHistory('assistant', "I can't see the screen yet."); say("I can’t see your screen yet, Hassen. Tap the eye at the bottom right, pick what to share, then ask me again."); return; }
  }
  if (!mem.groqKey){ say("I need a Groq key before I can look. Reload the page and paste it in."); return; }
  setState('looking'); brain.focus(2);
  const cam = source === 'camera';
  if (cam) lens.classList.add('looking');
  const shot = cam ? grabCamera() : grabFrame();
  if (!shot){ lens.classList.remove('looking'); say(cam ? "The camera’s still waking up. Ask again in a second." : "Your screen is still loading for me. Ask again in a second."); return; }
  showCard(shot);
  if (ctl) ctl.abort();
  ctl = new AbortController();
  try {
    const res = await groq('/chat/completions', { model:CHAT_MODEL, temperature:.6, max_completion_tokens:600, response_format:{ type:'json_object' },
      messages:[ { role:'system', content:PERSONA() + (cam ? CAMERA_RULES : VISION_RULES) }, ...mem.history.slice(0, -1),
        { role:'user', content:[ { type:'text', text:question }, { type:'image_url', image_url:{ url:shot } } ] } ] }, ctl.signal);
    const j = await res.json();
    const raw = visible(j.choices?.[0]?.message?.content || '');
    let spoken = '', seen = [];
    try { const o = JSON.parse((raw.match(/\{[\s\S]*\}/) || [raw])[0]); spoken = o.say || ''; seen = Array.isArray(o.seen) ? o.seen.filter(Boolean) : []; }
    catch(_){ spoken = raw; }
    spoken = speakable(spoken) || "I looked, but I couldn’t make sense of it. Try asking another way.";
    fillCard(seen);
    lens.classList.remove('looking');
    const record = spoken + (seen.length ? ` (${cam ? 'On camera' : 'On screen'}: ${seen.join(', ')}.)` : '');
    pushHistory('assistant', record); saveMemory();
    say(spoken);
    updateMemory(question, record);
  } catch (e){ lens.classList.remove('looking'); hideCardSoon(300); const m = groqError(e); if (m) say(m); }
}

    DU.uCenters.value[ci].copy(clusters[ci].center);
    DU.uCols.value[ci].copy(ci === 0 ? coreCol : clusters[ci].color);
    DU.uFlash.value[ci] = clusters[ci].flash;
  }

  // neural field around the brain
  {
    const sx = RX + LR + 1.5, sy = RY + LR + 1.2, sz = 1.3, fx = 1 + beat*.06;
    for (let i=FN-1;i>=FNA;i--) fA[i] = 0;
    for (let i=0;i<FNA;i++){
      const o = i*3, q = i*4, sp = fPh[q+3];
      const x = (fBase[o]*sx + .16*Math.sin(t*sp + fPh[q]))*fx;
      const y = (fBase[o+1]*sy + .16*Math.sin(t*sp*.8 + fPh[q+1]))*fx;
      const z = fBase[o+2]*sz + .16*Math.sin(t*sp*1.2 + fPh[q+2]);
      fPos[o] = x; fPos[o+1] = y; fPos[o+2] = z;
      // tint by nearest lobe, fade toward the edges
      let best = 1e9, bi = 0;
      for (let li=1; li<5; li++){ const c = clusters[li].center, d = (c.x-x)**2 + (c.y-y)**2 + (c.z-z)**2; if (d < best){ best = d; bi = li; } }
      const cc = clusters[bi].color, near = Math.max(0, 1 - Math.sqrt(best)/2.2);
      fCol[o] = cc.r*.75 + .25; fCol[o+1] = cc.g*.75 + .25; fCol[o+2] = cc.b*.75 + .25;
      const edge = Math.max(Math.abs(fBase[o]), Math.abs(fBase[o+1]));
      fA[i] = (.4 + .6*near)*(1 - Math.pow(edge, 4))*(1 + clusters[bi].flash*.6);
    }
    fGeo.attributes.position.needsUpdate = true; fGeo.attributes.aColor.needsUpdate = true; fGeo.attributes.aA.needsUpdate = true;
    gridLink(fPos, fA, fCol, FNA, (small ? .52 : .44)*(1 + beat*.2), fieldLines, .95);
  }

  // stretching spikes
  for (let ci=0; ci<clusters.length; ci++){
    const c = clusters[ci], off = offsets[ci], col = ci === 0 ? coreCol : c.color, amp = spikeAmp*(ci === 0 ? 1 : .65);
    if (amp < .03) continue;
    for (let i=0;i<Math.min(SPK, c.n);i++){
      const o = (off+i)*3, dx = P[o]-c.center.x, dy = P[o+1]-c.center.y, dz = P[o+2]-c.center.z, L = Math.hypot(dx,dy,dz) || 1;
      const wave = Math.pow(.5 + .5*Math.sin(Math.atan2(dz,dx)*3 + t*4.1 + dy*4)*Math.cos(dy*5 - t*2.7), 2);
      const len = amp*(.2 + .8*wave)*(.55 + .45*Math.sin(t*10 + c.ph[i*3]*7));
      const al = Math.min(1, len*2.4);
      spikes.seg(P[o],P[o+1],P[o+2], P[o]+dx/L*len, P[o+1]+dy/L*len, P[o+2]+dz/L*len, col.r,col.g,col.b, al*.85, 0);
    }
  }
  spikes.commit();

  // gentle sway
  rx += ((py*.15) - rx)*(1 - Math.exp(-dt*2.5));
  ry += ((px*.28) - ry)*(1 - Math.exp(-dt*2.5));
  if (!dragging){ userRY += velY; userRX = clamp(userRX + velX, -1.3, 1.3); velY *= Math.exp(-dt*3.2); velX *= Math.exp(-dt*3.2); }
  if (resetting){ const k = 1 - Math.exp(-dt*5); userRX -= userRX*k; userRY -= userRY*k; if (Math.abs(userRX) + Math.abs(userRY) < .002){ userRX = userRY = 0; resetting = false; } }
  zoom += (zoomT - zoom)*(1 - Math.exp(-dt*8));
  {
    let tx = 0, ty = -.3;
    if (camFocus >= 0){ tmpV.copy(lobes[camFocus].center).applyMatrix4(world.matrixWorld); tx = tmpV.x; ty = tmpV.y; }
    const k = 1 - Math.exp(-dt*4);
    camX += (tx - camX)*k; camY += (ty - camY)*k;
    camera.position.set(camX, camY, baseDist/zoom); camera.lookAt(camX, camY, 0);
  }
  world.rotation.set(rx + userRX + Math.sin(t*.11)*.06, ry + userRY + Math.sin(t*.15)*.22, Math.sin(t*.09)*.03);
  world.updateMatrixWorld();

  renderer.render(scene, camera);
  frameNo++;
  neonDt += dt;
  if (frameNo % (quality >= 2 ? 3 : 2) === 0){ drawNeon(neonDt, beat); neonDt = 0; }

  // adaptive quality: if frames get slow, quietly lighten the scene
  frameEma = frameEma*.95 + dt*1000*.05;
  if (t > 4 && t - qualityAt > 3 && frameEma > 24 && quality < 2){
    quality++; qualityAt = t;
    if (quality === 1){ PR = 1; renderer.setPixelRatio(1); layout(); }
    if (quality === 2){ FNA = Math.floor(FN*.5); duGeo.setDrawRange(0, Math.floor(DUSTN*.5)); }
  }

  // labels and memory pops follow their lobes
  const w = innerWidth, h = innerHeight, ppu = h/(2*camera.position.z*tanH);
  lobes.forEach((c, i) => {
    tmpV.copy(c.center).applyMatrix4(world.matrixWorld).project(camera);
    const x = (tmpV.x*.5 + .5)*w, y = (-tmpV.y*.5 + .5)*h;
    screenPos[i] = [x, y];
    const below = LOBES[i].ang < 0;
    const ly = below ? y + LR*1.3*ppu : y - LR*1.3*ppu - 34;
    labelEls[i].style.transform = `translate(${x.toFixed(1)}px, ${ly.toFixed(1)}px) translate(-50%,0)`;
  });
  if (memCards.length){
    const all = memFocus === 4, cxs = w/2, cys = h*.46;
    memCards.forEach(c => {
      const [lx, ly] = screenPos[c.li] || [cxs, cys];
      let x, y;
      if (!all){
        const a = -Math.PI/2 + (c.k/c.n)*Math.PI*2;
        const rx = Math.min(w*.38, 440), ry = Math.min(h*.33, 300);
        x = lx + Math.cos(a)*rx; y = ly + Math.sin(a)*ry;
      } else {
        const base = Math.atan2(ly - cys, lx - cxs), a = base + (c.k - (c.n - 1)/2)*.55, d = Math.min(w, h)*.21 + (c.k % 2)*46;
        x = lx + Math.cos(a)*d; y = ly + Math.sin(a)*d;
      }
      const hw = (c.w || 180)/2 + 10, hh = (c.h || 40)/2 + 10;
      x = clamp(x, hw, w - hw); y = clamp(y, hh + 60, h - hh - 90);
      c.x = x; c.y = y;
      c.el.style.transform = `translate(${(x - (c.w || 180)/2).toFixed(1)}px, ${(y - (c.h || 40)/2).toFixed(1)}px)`;
      c.line.setAttribute('x1', lx.toFixed(1)); c.line.setAttribute('y1', ly.toFixed(1));
      c.line.setAttribute('x2', x.toFixed(1)); c.line.setAttribute('y2', y.toFixed(1));
      c.dot.setAttribute('cx', x.toFixed(1)); c.dot.setAttribute('cy', y.toFixed(1));
    });
    memCards.forEach(c => { if (c.link && c.link.prev.x != null){ const l = c.link.line, p = c.link.prev;
      l.setAttribute('x1', p.x.toFixed(1)); l.setAttribute('y1', p.y.toFixed(1)); l.setAttribute('x2', c.x.toFixed(1)); l.setAttribute('y2', c.y.toFixed(1)); } });
  }
  pops.forEach(p => {
    const [x, y] = screenPos[p.li] || [w/2, h/2];
    const right = LOBES[p.li].ang > -1.57 && LOBES[p.li].ang < 1.57;
    const pw = p.el.offsetWidth || 200;
    let tx = right ? x + LR*1.15*ppu : x - LR*1.15*ppu - pw;
    tx = clamp(tx, 10, w - pw - 10);
    const ty = clamp(y - 24, 70, h - 140);
    p.el.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px)`;
    p.el.style.setProperty('--x', tx.toFixed(1) + 'px'); p.el.style.setProperty('--y', ty.toFixed(1) + 'px');
  });

  requestAnimationFrame(frame);
}
setState('idle');
requestAnimationFrame(frame);
})();
</script>
</body>
